name: Deploy to Coolify

# Called by TMS CI once the validate job passes on main, so a commit whose
# build or tests failed cannot reach production. Previously this triggered on
# the same push event as CI, and the two raced.
#
# Deliberately gated on validate alone rather than the whole CI run: the mobile
# job builds a separately released Flutter app, and a red analyze there must
# not hold back a web/API deploy.
on:
  workflow_call:
  # Kept so a deploy or rollback can still be forced from the Actions tab.
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Report what triggered this deploy
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual deploy requested by ${{ github.actor }}."
          else
            echo "Validate passed on ${{ github.sha }}; deploying."
          fi
      - name: Trigger Coolify production deploy
        run: |
          if [ -z "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" ]; then
            echo "::error::COOLIFY_DEPLOY_WEBHOOK secret is not set."
            echo "Get it from Coolify → API service → Deploy Webhooks → copy the URL."
            exit 1
          fi
          echo "Triggering Coolify deploy..."
          curl -sS -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n" \
            -o /tmp/deploy_response.json
          cat /tmp/deploy_response.json
      - name: Wait for deploy to start
        run: sleep 15
      - name: Verify production health
        run: |
          echo "Checking /api/health ..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              "https://api.tms.sanskardipshikshalaya.com.np/api/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Production is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Health check did not return 200 within 60s — verify in Coolify dashboard."
          exit 0
