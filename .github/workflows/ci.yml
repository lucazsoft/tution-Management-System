name: TMS CI

on:
  push:
    branches: [main, develop, staging, mobile-app]
  pull_request:
    branches: [main, develop, staging, mobile-app]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede stale pull-request runs, but let every branch push finish: the
  # deploy workflow gates on this run's conclusion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build, lint, schema, and authorization checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Web lint
        run: npm run lint --workspace=web

      - name: Shared types build
        run: npm run build --workspace=@tms/types

      - name: Prisma client generation
        run: npx prisma generate --schema services/api/prisma/schema.prisma

      - name: Web build
        run: npm run build --workspace=web

      - name: Shared account menu browser regression
        run: npm run test:account-menu --workspace=web

      - name: Two-step settings browser regression
        run: npm run test:two-step-settings --workspace=web

      - name: API build
        run: npm run build --workspace=@tms/api

      - name: Prisma schema validation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tms?schema=public
        run: npx prisma validate --schema services/api/prisma/schema.prisma

      - name: API test suites
        # Runs every `test:*` script in services/api via scripts/run-tests.js,
        # so a new suite needs no workflow change. Suites needing Postgres are
        # skipped until CI has a database service.
        run: npm test --workspace=@tms/api

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Secret and fixed-identifier scan
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude='test-*.ts' --exclude='smoke.js' \
            -e 'TMSWelcome[0-9]' -e 'PinnacleAdmin' -e 'BaneshworAdmin' \
            -e 'b-baneshwor-01' -e 'janitor-staff-user-300' \
            apps services packages

  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (errors only fail)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

  # Production deploy, gated on validate only. The mobile job ships a separately
  # released Flutter app, so a failure there must not block a web/API deploy —
  # which is why this is a `needs:` dependency rather than a workflow_run gate
  # on the whole run's conclusion.
  deploy:
    name: Deploy to Coolify
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
